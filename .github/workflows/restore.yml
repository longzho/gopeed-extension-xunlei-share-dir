name: restore-files
on:
  push:
    paths:
      - .github/workflows/restore.yml
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: restore
        run: |
          git show 951dfb4:patch.py > patch.py
          git show 951dfb4:README.md > README.md
          git show 951dfb4:NOTICE.md > NOTICE.md
          python3 fix.py
          git clone --depth 1 https://github.com/cybdarlnig-png/gopeed-extension-xunlei.git up
          python3 patch.py
          python3 fixurl.py
          cp up/index.js up/manifest.json up/icon.png .
          git rm -q fix.py fixurl.py .github/workflows/restore.yml
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[skip ci] restore: 恢复误覆盖的文件并同步新标识"
          git push
